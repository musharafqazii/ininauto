[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "ininauto-qft"
version = "0.7.0"
description = "In-in perturbation theory on perturbed FLRW from the action: scalar, fermionic and Higgs-portal sectors"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12", "numpy>=1.23"]
[project.optional-dependencies]
plots = ["matplotlib>=3.6"]
[tool.setuptools.packages.find]
where = ["."]
include = ["ininauto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
